<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research briefs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FCFCFB; color: #2E2C27; font-family: -apple-system, "Segoe UI", sans-serif; }
  .band-top { background: #F9F9F7; border-bottom: 1px solid #E1E1DF; padding: 56px 24px; }
  .band-bottom { background: #FCFCFB; padding: 48px 24px; }
  .inner { max-width: 860px; margin: 0 auto; }
  .meta { font-size: 13px; color: #6B6A63; margin-bottom: 18px; }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 40px; line-height: 1.2; }
  @media (max-width: 640px) { h1 { font-size: 30px; } }
</style>
</head>
<body>
  <div class="band-top"><div class="inner">
    <div class="meta">Research briefs · maintained automatically</div>
    <h1>Briefs will appear here after the first runs.</h1>
  </div></div>
  <div class="band-bottom"><div class="inner"></div></div>
</body>
</html>
